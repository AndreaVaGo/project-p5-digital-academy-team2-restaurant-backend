spring.application.name=goxu

# core
spring.profiles.active=mysql

# base end-points config
api-endpoint=/api

# Docker
spring.docker.compose.enabled=true

# Crea y actualiza las tablas desde las entidades al arrancar.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que ejecuta Hibernate 
spring.jpa.show-sql=true

# Ejecuta data.sql también con MySQL 
spring.sql.init.mode=always

# Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas (en caso contratrio, roles, no existe)
spring.jpa.defer-datasource-initialization=true

# Supabase Storage (para el PDF del resumen de ventas)
supabase.enabled=${SUPABASE_ENABLED:false}
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:informes-ventas}

# Clave secreta para firmar y verificar los JWT (HS512 exige 64 caracteres como mínimo)
jwt.key=goxu-team2-secret-key-for-signing-jwt-tokens-hs512-minimum-64-characters

# Email (SMTP) 
spring.config.import=optional:application-secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true